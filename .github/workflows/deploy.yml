name: Test and Deploy ArzanKadeh AI Worker

on:
  push:
    branches:
      - cloudflare-webhook-migration

jobs:
  test:
    name: Run Worker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"

      - name: Generate lockfile
        run: uv lock

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lockfile
          path: uv.lock
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Worker
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"

      - name: Download lockfile
        uses: actions/download-artifact@v4
        with:
          name: uv-lockfile
          path: .

      - name: Deploy Worker
        run: uv run --locked pywrangler deploy