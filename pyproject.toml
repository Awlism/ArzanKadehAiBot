[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arzankadehaibot"
version = "0.1.0"
description = "ArzanKadeh AI Cloudflare Python Worker"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = [
    "bot",
    "bot.*",
]

[dependency-groups]
dev = [
    "workers-py>=1.1.7",
    "workers-runtime-sdk",
]