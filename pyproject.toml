[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arzankadehaibot"
version = "0.1.0"
description = "ArzanKadeh AI Cloudflare Python Worker"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "worker",
    "worker.*",
    "worker_backend",
    "worker_backend.*",
]

[dependency-groups]
dev = [
    "workers-py>=1.1.7",
    "workers-runtime-sdk",
]